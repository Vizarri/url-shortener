server:
  port: 8080
  tomcat:
    max-http-response-header-size: 32KB

spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: url_shortener
    password: url_shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    resources:
      cache:
        use-last-modified: false
        cachecontrol:
          no-store: true
